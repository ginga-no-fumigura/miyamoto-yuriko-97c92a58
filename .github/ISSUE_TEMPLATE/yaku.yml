name: 大意の誤り
description: 大意の誤りや、よりよい大意を知らせる
title: "[訳] 宮本百合子 詩篇（『宮本百合子全集 第十八巻』より） "
labels: ["訳"]
body:
  - type: input
    id: block
    attributes:
      label: 段落ID
      description: "行頭にある ID（例: miyamoto-yuriko-97c92a58-000001）"
    validations:
      required: true
  - type: textarea
    id: before
    attributes:
      label: いまの大意
    validations:
      required: true
  - type: textarea
    id: after
    attributes:
      label: 直した大意
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: 理由・根拠
